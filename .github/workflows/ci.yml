name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Bun 1.3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run audit
      - run: bun run package:check
        env:
          ADROUTER_STAGING_OUTPUT: staging
      - name: Validate OpenCode plugin installation, models, and auth discovery
        run: bun run plugin:check

      - name: Record tested artifact checksums
        run: bun scripts/staging-manifest.mjs staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-${{ github.sha }}-${{ matrix.os }}
          path: staging/
          if-no-files-found: error
          retention-days: 7
